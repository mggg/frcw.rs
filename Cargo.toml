[package]
name = "rustrecom"
version = "0.2.0"
authors = ["Parker J. Rule <parker.rule@tufts.edu>", "Peter Rock <peter.r.rock2@gmail.com>"]
edition = "2021"
default-run = "rustrecom"

[dependencies]
# `string` lets the CLI name itself from argv[0] (rustrecom vs the frcw alias).
clap = { version = "4.6.5", features = ["string"] }
crossbeam-channel = "0.5.16"
crossbeam = "0.8.4"
mimalloc = { version = "0.1.52", default-features = false }
ndarray = { version = "0.17.2", optional = true }
ndarray-linalg = { version = "0.18.1", features = ["openblas-system"], optional = true }
pcompress = "1.0.7"
petgraph = "0.8.3"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha3 = "0.12.0"
snafu = "0.9.2"
itertools = "0.15.0"
binary-ensemble = "2.0.0"
indicatif = "0.18.6"

[dev-dependencies]
rstest = "0.26.1"
criterion = "0.8.2"
approx = "0.5.1"
test_fixtures = { path = "test_fixtures" }

[features]
# Enables spanning tree statistics (and eventually other features
# that depend on a working BLAS installation).
linalg = ["ndarray", "ndarray-linalg"]

[[bench]]
name = "recom"
harness = false

[profile.dev]
split-debuginfo = "unpacked"
debug = true
opt-level = 3

[profile.release]
debug = false
lto = true
codegen-units = 1
panic = "abort"
